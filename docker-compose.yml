# Local development: `docker compose up -d db` and run the API with `pnpm dev`.
# Production on a VPS: `docker compose --profile prod up -d` (put a reverse proxy with TLS in front).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kollektor
      POSTGRES_PASSWORD: kollektor
      POSTGRES_DB: kollektor
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kollektor']
      interval: 5s
      retries: 10

  migrate:
    profiles: [prod]
    build: .
    command: ['sh', '-c', 'pnpm db:migrate && pnpm db:seed']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kollektor:kollektor@db:5432/kollektor
    depends_on:
      db: { condition: service_healthy }

  api:
    profiles: [prod]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kollektor:kollektor@db:5432/kollektor
      NODE_ENV: production
    ports: ['3001:3001']
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata:
